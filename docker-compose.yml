version: "3.8"

services:
  omni-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni-mcp-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OMNI_ENV=production
      - OMNI_HOST=0.0.0.0
      - OMNI_PORT=8080
      - OMNI_LOG_LEVEL=INFO
      - OMNI_CACHE_REFRESH_INTERVAL=2.0
      - OMNI_DEFAULT_RATE_LIMIT_RPM=1200
      - OMNI_ENABLE_PII_REDACTION=true
      - OMNI_WORKER_THREADS=16
      - OMNI_CB_THRESHOLD=5
      - OMNI_CB_RESET_SEC=30.0
      - OMNI_SEMANTIC_CACHE_TTL_SEC=15.0
    volumes:
      - omni-data:/app/data

volumes:
  omni-data:
    driver: local
