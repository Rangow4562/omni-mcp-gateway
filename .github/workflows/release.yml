name: Release and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: omni-gateway
            asset_name: omni-gateway-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: omni-gateway
            asset_name: omni-gateway-linux-arm64
          - os: macos-latest
            target: macos-universal
            binary_name: omni-gateway
            asset_name: omni-gateway-darwin
          - os: windows-latest
            target: windows-universal
            binary_name: omni-gateway.exe
            asset_name: omni-gateway-win32

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-linker (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.target == 'windows-universal' && 'x86_64-pc-windows-msvc,aarch64-pc-windows-msvc' || matrix.target) }}

      - name: Build Release Binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc cargo build --release --target ${{ matrix.target }} --bin omni-gateway
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
            chmod +x dist/${{ matrix.asset_name }}
          elif [ "${{ matrix.target }}" = "macos-universal" ]; then
            cargo build --release --target aarch64-apple-darwin --bin omni-gateway
            cargo build --release --target x86_64-apple-darwin --bin omni-gateway
            cp target/aarch64-apple-darwin/release/omni-gateway dist/omni-gateway-darwin-arm64
            cp target/x86_64-apple-darwin/release/omni-gateway dist/omni-gateway-darwin-x64
            chmod +x dist/omni-gateway-darwin-*
          elif [ "${{ matrix.target }}" = "windows-universal" ]; then
            cargo build --release --target x86_64-pc-windows-msvc --bin omni-gateway
            cargo build --release --target aarch64-pc-windows-msvc --bin omni-gateway
            cp target/x86_64-pc-windows-msvc/release/omni-gateway.exe dist/omni-gateway-win32-x64.exe
            cp target/aarch64-pc-windows-msvc/release/omni-gateway.exe dist/omni-gateway-win32-arm64.exe
          else
            cargo build --release --target ${{ matrix.target }} --bin omni-gateway
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
            chmod +x dist/${{ matrix.asset_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  release-and-publish:
    name: GitHub Release & NPM Publish
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          body_path: docs/RELEASE_v4.7.0.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM
        if: env.NPM_TOKEN != ''
        run: |
          # Copy all platform binaries into bin folder before packaging
          cp release-assets/omni-gateway-win32-x64.exe bin/ 2>/dev/null || true
          cp release-assets/omni-gateway-win32-arm64.exe bin/ 2>/dev/null || true
          cp release-assets/omni-gateway-darwin-arm64 bin/ 2>/dev/null || true
          cp release-assets/omni-gateway-darwin-x64 bin/ 2>/dev/null || true
          cp release-assets/omni-gateway-linux-x64 bin/ 2>/dev/null || true
          cp release-assets/omni-gateway-linux-arm64 bin/ 2>/dev/null || true
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rangow4562'

      - name: Publish to GitHub Packages
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@rangow4562/omni-mcp";
            pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
