    <text x="14" y="25" fill="#6D28D9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">MCP 2026-07-28 &amp; Extensions</text>
    <text x="14" y="46" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">server/discover · Skills · Tasks (GA)</text>
