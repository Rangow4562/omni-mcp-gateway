    <text x="16" y="48" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• FIPS 180-4 SHA-256 Merkle chain + HMAC-SHA256 .ckpt + Postgres AuditSink</text>
    <text x="16" y="68" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• FileBlobBackend: local | postgres BYTEA | s3 SigV4 | gcs | azure | http</text>
    <text x="16" y="90" fill="#059669" font-family="monospace" font-size="11">GET /api/audit/verify · 60s Task &amp; File Blob TTL Reapers</text>
  </g>

