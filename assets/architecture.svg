    <text x="14" y="25" fill="#059669" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">PgWirePool HA + SQLite + WAL</text>
    <text x="14" y="47" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• PgWirePool (OMNI_PG_POOL_SIZE=8)</text>
    <text x="14" y="66" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• LISTEN omni_registry_changed vs</text>
    <text x="14" y="84" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">  omni_task_changed (no reload storm)</text>
    <text x="14" y="103" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Shared omni_oauth_tokens (AEAD)</text>
    <text x="14" y="128" fill="#059669" font-family="monospace" font-size="10.5">SQL CAS · omni_mcp_tasks · file_blobs</text>
  </g>

  <g transform="translate(890, 438)">
