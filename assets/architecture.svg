    <text x="14" y="84" fill="#6D28D9" font-family="monospace" font-size="10.5">/omni/mcp · /groups/&lt;slug&gt;/mcp</text>
  </g>

  <g transform="translate(52, 358)">
    <rect width="224" height="102" rx="8" fill="#FFFFFF" stroke="#DFE3EC"/>
