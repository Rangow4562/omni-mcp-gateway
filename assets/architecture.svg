    <text x="14" y="64" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">OIDC/JWKS · AEAD OAuth PKCE</text>
    <text x="14" y="84" fill="#B45309" font-family="monospace" font-size="10.5">/api/v1/files/upload/:id (PUT)</text>
  </g>

