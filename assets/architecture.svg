<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F6F9"/>
      <stop offset="100%" stop-color="#EEEFF4"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="1240" height="720" rx="14" fill="url(#bg)" stroke="#D8DCE6" stroke-width="2"/>

  <!-- Top Title Header -->
  <rect x="36" y="24" width="108" height="34" rx="7" fill="url(#violetGrad)"/>
  <text x="90" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">OMNIMCP</text>
  <text x="160" y="47" fill="#181A20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="21">ENTERPRISE MCP FLEET &amp; CODE MODE ARCHITECTURE (v6.0)</text>
  <text x="1202" y="46" fill="#059669" font-family="monospace" font-weight="700" font-size="12.5" text-anchor="end">● RUSTLS · TOKIO · SQLITE WAL · WASMI</text>

  <!-- Column 1: Clients & Harnesses -->
  <rect x="36" y="78" width="256" height="606" rx="10" fill="#FAFAFC" stroke="#DCDFE8" stroke-width="1.5"/>
  <text x="54" y="108" fill="#6D28D9" font-family="-apple-system, sans-serif" font-weight="800" font-size="12.5" letter-spacing="1">1. CLIENTS &amp; HARNESSES</text>

  <g transform="translate(52, 126)">
    <rect width="224" height="98" rx="8" fill="#FFFFFF" stroke="#DFE3EC"/>
    <text x="14" y="25" fill="#181A20" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">AI Coding Agents &amp; CLIs</text>
    <text x="14" y="46" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">Claude · Codex · Cursor · Antigravity</text>
    <text x="14" y="64" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">NPX Zero-Install &amp; Native Binaries</text>
    <text x="14" y="84" fill="#059669" font-family="monospace" font-size="10.5">omni / aifx --stdio | mcp call</text>
  </g>

  <g transform="translate(52, 240)">
    <rect width="224" height="102" rx="8" fill="#FFFFFF" stroke="#DFE3EC"/>
    <text x="14" y="25" fill="#6D28D9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">Streamable HTTP &amp; Groups</text>
    <text x="14" y="46" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">MCP 2024-11-05 .. 2026-07-28</text>
    <text x="14" y="64" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">Scoped Virtual Tool Groups</text>
    <text x="14" y="84" fill="#6D28D9" font-family="monospace" font-size="10.5">/omni/mcp · /groups/&lt;slug&gt;/mcp</text>
  </g>

  <g transform="translate(52, 358)">
    <rect width="224" height="102" rx="8" fill="#FFFFFF" stroke="#DFE3EC"/>
    <text x="14" y="25" fill="#6D28D9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">Auth &amp; Mesh Callers</text>
    <text x="14" y="46" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">OIDC/JWKS (RS256/ES256/EdDSA)</text>
    <text x="14" y="64" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">HS256 + RFC 8707/8693/9728</text>
    <text x="14" y="84" fill="#B45309" font-family="monospace" font-size="10.5">Virtual /&lt;service&gt;/mcp (mTLS)</text>
  </g>

  <g transform="translate(52, 476)">
    <rect width="224" height="190" rx="8" fill="#F5F3FF" stroke="#8B5CF6"/>
    <text x="14" y="25" fill="#181A20" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">React 18 Fleet &amp; Studio UI</text>
    <text x="14" y="48" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Live Fleet SSE Telemetry</text>
    <text x="14" y="68" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• ToolGroupsStudio &amp; Diffs</text>
    <text x="14" y="88" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• CodeModeStudio Playground</text>
    <text x="14" y="108" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• HITL Approval &amp; Audit View</text>
    <text x="14" y="138" fill="#6D28D9" font-family="monospace" font-size="10.5">GET /api/v1/events (SSE)</text>
    <text x="14" y="158" fill="#059669" font-family="monospace" font-size="10.5">Playwright E2E Verified</text>
  </g>

  <!-- Column 2: Data Plane & Code Mode Engine -->
  <rect x="324" y="78" width="516" height="606" rx="10" fill="#FAFAFC" stroke="#7C3AED" stroke-width="2"/>
  <text x="346" y="108" fill="#6D28D9" font-family="-apple-system, sans-serif" font-weight="800" font-size="12.5" letter-spacing="1">2. DATA PLANE &amp; CODE MODE ENGINE (TOKIO + RUSTLS)</text>

  <!-- Async Ingress & Auth -->
  <g transform="translate(344, 126)">
    <rect width="476" height="104" rx="8" fill="#FFFFFF" stroke="#DFE3EC"/>
    <text x="16" y="25" fill="#181A20" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Async HTTP/1.1 + rustls TLS/mTLS Front Door</text>
    <text x="16" y="46" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• serve_async_listener / run_async_server + Origin DNS-rebinding guard</text>
    <text x="16" y="65" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Deny-by-default RBAC (Agent / Operator / Approver / Admin) &amp; 16-shard limiter</text>
    <text x="16" y="86" fill="#6D28D9" font-family="monospace" font-size="11">/omni/mcp · /api/v1/* · /openapi.json · /healthz · /metrics</text>
  </g>

  <!-- Code Mode v2 & Wasm Sandbox -->
  <g transform="translate(344, 244)">
    <rect width="476" height="148" rx="8" fill="#F5F3FF" stroke="#8B5CF6"/>
    <text x="16" y="25" fill="#6D28D9" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Omni Code Mode v2 &amp; wasmi Sandbox (src/data_plane/codemode/)</text>
    <text x="16" y="47" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• Okapi BM25 (k1=1.2, b=0.75) 0-turn .d.ts schema pre-injection (65–95% savings)</text>
    <text x="16" y="67" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• Pure-Rust AST VM (~100 us) + wasmi fuel-metered Wasm sandbox (sandbox-wasm)</text>
    <text x="16" y="87" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• SSA ParallelWave pass + ColumnarRecordBatch vectorized PhysicalExpr pushdown</text>
    <text x="16" y="107" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• HMAC-SHA256 SuspendedExecutionFrame + CAS resume + LIFO Saga rollbacks</text>
    <text x="16" y="130" fill="#059669" font-family="monospace" font-size="11">globalOutbound: null · -320xx error contract · Xoshiro256StarStar DST</text>
  </g>

  <!-- Routing, Resilience & Observability -->
  <g transform="translate(344, 406)">
    <rect width="476" height="136" rx="8" fill="#FFFFFF" stroke="#DFE3EC"/>
    <text x="16" y="25" fill="#059669" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Routing, Resilience, Wire Translation &amp; Telemetry</text>
    <text x="16" y="47" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• CoW Arc&lt;BTreeMap&gt; routing table + Canary weighted routing &amp; fallback</text>
    <text x="16" y="67" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Per-service Circuit Breaker + TTL Semantic Cache + Response Projection</text>
    <text x="16" y="87" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• DFA PII/Secret Redactor + W3C traceparent OTLP exporter (src/telemetry/)</text>
    <text x="16" y="114" fill="#6D28D9" font-family="monospace" font-size="11">HttpDownstreamClient (rustls) · gRPC / Thrift / Mesh RPC Translators</text>
  </g>

  <!-- Segmented Merkle Audit -->
  <g transform="translate(344, 556)">
    <rect width="476" height="110" rx="8" fill="#ECFDF5" stroke="#10B981"/>
    <text x="16" y="25" fill="#059669" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Segmented Merkle Audit &amp; Checkpoints (AuditSink)</text>
    <text x="16" y="48" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• Zero-dependency FIPS 180-4 SHA-256 Merkle chain with sliding window</text>
    <text x="16" y="68" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• Automatic JSONL segment rotation + HMAC-SHA256 signed .ckpt checkpoints</text>
    <text x="16" y="90" fill="#059669" font-family="monospace" font-size="11">GET /api/audit/verify · SQLite AuditSink persistence</text>
  </g>

  <!-- Column 3: Control Plane, Storage & Upstreams -->
  <rect x="872" y="78" width="332" height="606" rx="10" fill="#FAFAFC" stroke="#DCDFE8" stroke-width="1.5"/>
  <text x="892" y="108" fill="#059669" font-family="-apple-system, sans-serif" font-weight="800" font-size="12.5" letter-spacing="1">3. CONTROL PLANE &amp; FLEET</text>

  <g transform="translate(890, 126)">
    <rect width="296" height="132" rx="8" fill="#FFFFFF" stroke="#DFE3EC"/>
    <text x="14" y="25" fill="#B45309" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">Registry, AutoCrawler &amp; Diffs</text>
    <text x="14" y="47" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Protobuf v2/v3, Thrift &amp; OpenAPI 3.1</text>
    <text x="14" y="66" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Disabled-by-default tool gate</text>
    <text x="14" y="85" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• ConfigDiff review, approval &amp; rollback</text>
    <text x="14" y="108" fill="#B45309" font-family="monospace" font-size="10.5">omni import mcp.json · migrate --to-v6</text>
  </g>

  <g transform="translate(890, 274)">
    <rect width="296" height="128" rx="8" fill="#FFFFFF" stroke="#DFE3EC"/>
    <text x="14" y="25" fill="#059669" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">SQLite WAL + CAS Store</text>
    <text x="14" y="47" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• RegistryStorageBackend (storage-sqlite)</text>
    <text x="14" y="66" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Atomic CAS continuation consumption</text>
    <text x="14" y="85" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• FNV-1a WAL + atomic snapshot compaction</text>
    <text x="14" y="108" fill="#059669" font-family="monospace" font-size="10.5">Crash-safe Saga &amp; fleet state</text>
  </g>

  <g transform="translate(890, 418)">
    <rect width="296" height="248" rx="8" fill="#F5F3FF" stroke="#8B5CF6"/>
    <text x="14" y="25" fill="#6D28D9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13.5">External MCP Fleet &amp; Targets</text>
    <text x="14" y="50" fill="#181A20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">1. Stdio MCP (omni-process-guard)</text>
    <text x="14" y="68" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11">   ID-multiplexed, per-tool timeout_ms</text>
    <text x="14" y="86" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11">   Win Job Objects / Linux killpg</text>
    <text x="14" y="114" fill="#181A20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">2. Streamable HTTP / SSE (rustls)</text>
    <text x="14" y="132" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11">   ext://&lt;slug&gt;/&lt;uri&gt; resources &amp; prompts</text>
    <text x="14" y="150" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11">   Opt-in AutoSyncScheduler</text>
    <text x="14" y="178" fill="#181A20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">3. Downstream Services &amp; 3P OAuth</text>
    <text x="14" y="196" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11">   HTTP/gRPC/Thrift + RFC 8693 exchange</text>
    <text x="14" y="226" fill="#6D28D9" font-family="monospace" font-size="10.5">Docker · Linux · macOS · Windows</text>
  </g>

  <!-- Connectors -->
  <line x1="292" y1="175" x2="324" y2="175" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <line x1="292" y1="290" x2="324" y2="290" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <line x1="292" y1="408" x2="324" y2="408" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="324" y1="570" x2="292" y2="570" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <line x1="840" y1="190" x2="872" y2="190" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="840" y1="335" x2="872" y2="335" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="840" y1="510" x2="872" y2="510" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrowViolet)"/>
</svg>
