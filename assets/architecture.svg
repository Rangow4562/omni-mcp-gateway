<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F6F9"/>
      <stop offset="100%" stop-color="#EEEFF4"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="1240" height="720" rx="14" fill="url(#bg)" stroke="#D8DCE6" stroke-width="2"/>

  <!-- Top Title Header -->
  <rect x="36" y="24" width="108" height="34" rx="7" fill="url(#violetGrad)"/>
  <text x="90" y="46" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">OMNIMCP</text>
  <text x="160" y="47" fill="#181A20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="21">ENTERPRISE MCP FLEET &amp; CODE MODE ARCHITECTURE (v6.8)</text>
  <circle cx="884" cy="42" r="4" fill="#059669"/>
  <text x="1202" y="46" fill="#059669" font-family="monospace" font-weight="700" font-size="12" text-anchor="end">SKILLS · TASKS · ELICITATION · WASM ABI v2</text>

  <!-- Column 1: Clients & Harnesses -->
  <rect x="36" y="78" width="256" height="606" rx="10" fill="#FAFAFC" stroke="#DCDFE8" stroke-width="1.5"/>
  <text x="54" y="108" fill="#6D28D9" font-family="-apple-system, sans-serif" font-weight="800" font-size="12.5" letter-spacing="1">1. CLIENTS &amp; STUDIO v4</text>

  <g transform="translate(52, 126)">
    <rect width="224" height="98" rx="8" fill="#FFFFFF" stroke="#DFE3EC"/>
