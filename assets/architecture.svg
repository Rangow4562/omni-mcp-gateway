    <text x="14" y="46" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">Claude · Codex · Cursor · Antigravity</text>
    <text x="14" y="64" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">Skills CLI &amp; v6.8 Migration</text>
    <text x="14" y="84" fill="#059669" font-family="monospace" font-size="10.5">omni skills | migrate --to-v6.8</text>
  </g>

  <g transform="translate(52, 240)">
