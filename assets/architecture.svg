    <text x="14" y="49" fill="#181A20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">1. Stdio MCP (omni-process-guard)</text>
    <text x="14" y="67" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11">   Win Job Objects / Linux killpg</text>
    <text x="14" y="93" fill="#181A20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">2. Streamable HTTP / SSE (rustls)</text>
    <text x="14" y="111" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11">   Auto-refresh AEAD OAuth + callbacks</text>
    <text x="14" y="137" fill="#181A20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">3. Native .wasm Plugins &amp; Cloud</text>
    <text x="14" y="155" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11">   WasmPlugin · AWS S3 · GCS · Azure</text>
    <text x="14" y="173" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11">   HTTP/2 gRPC · REST · WebDAV</text>
    <text x="14" y="206" fill="#6D28D9" font-family="monospace" font-size="10.5">Docker · Kubernetes · Linux · macOS · Win</text>
  </g>

