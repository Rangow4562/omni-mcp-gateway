    <text x="14" y="48" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• SkillsStudio &amp; SHA-256 Verify</text>
    <text x="14" y="68" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• TasksMonitor &amp; Live Cancel</text>
    <text x="14" y="88" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Unified Approval/Elicit Inbox</text>
    <text x="14" y="108" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Trace Waterfall &amp; Merkle Audit</text>
    <text x="14" y="138" fill="#6D28D9" font-family="monospace" font-size="10.5">GET /api/v1/events (SSE)</text>
    <text x="14" y="158" fill="#059669" font-family="monospace" font-size="10.5">5/5 Playwright E2E Verified</text>
  </g>

  <!-- Column 2: Data Plane & Code Mode Engine -->
  <rect x="324" y="78" width="516" height="606" rx="10" fill="#FAFAFC" stroke="#7C3AED" stroke-width="2"/>
  <text x="346" y="108" fill="#6D28D9" font-family="-apple-system, sans-serif" font-weight="800" font-size="12.5" letter-spacing="1">2. DATA PLANE, TASKS &amp; WASM ABI v2 (TOKIO + RUSTLS)</text>

  <!-- Async Ingress & Auth -->
  <g transform="translate(344, 126)">
    <rect width="476" height="104" rx="8" fill="#FFFFFF" stroke="#DFE3EC"/>
    <text x="16" y="25" fill="#181A20" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Non-Blocking AsyncTlsStream + Elicitation &amp; RBAC</text>
    <text x="16" y="46" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Dual async/sync chunked upload bypass (64 MiB) + 10 MiB JSON-RPC guard</text>
    <text x="16" y="65" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Argument-level ABAC, Tenant Quotas, Secret-Safe form &amp; url Elicitation</text>
    <text x="16" y="86" fill="#6D28D9" font-family="monospace" font-size="9.5">tasks/get|update|cancel · skills/list|get · resources/directory/read</text>
  </g>

  <!-- Code Mode v2 & Wasm Sandbox -->
  <g transform="translate(344, 244)">
    <rect width="476" height="148" rx="8" fill="#F5F3FF" stroke="#8B5CF6"/>
    <text x="16" y="25" fill="#6D28D9" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">TaskManager, Code Mode &amp; Wasm Guest ABI v2</text>
    <text x="16" y="47" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• 250ms grace-window promotion → resultType: "task" + cooperative cancel_flag</text>
    <text x="16" y="67" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• Hybrid Okapi BM25 + 256-dim Dense Vector RRF + Canonical Semantic Cache</text>
    <text x="16" y="87" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• Wasm ABI v2: omni::call_tool, omni::file_stat, omni::file_read_chunk (256 KiB)</text>
    <text x="16" y="107" fill="#181A20" font-family="-apple-system, sans-serif" font-size="11.5">• SSA ParallelWave + ColumnarRecordBatch + CAS resume + LIFO Saga rollback</text>
    <text x="16" y="130" fill="#059669" font-family="monospace" font-size="11">globalOutbound: null · -320xx error contract · Xoshiro256StarStar DST</text>
  </g>

  <!-- Routing, Resilience & Observability -->
  <g transform="translate(344, 406)">
    <rect width="476" height="136" rx="8" fill="#FFFFFF" stroke="#DFE3EC"/>
    <text x="16" y="25" fill="#059669" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Live REST/gRPC Streaming, Mesh &amp; OTLP Telemetry</text>
    <text x="16" y="47" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• HttpDownstreamClient (GET/POST/PUT/PATCH/DELETE + post_stream_file)</text>
    <text x="16" y="67" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• GrpcDownstreamClient (HTTP/2 h2c/h2 + HPACK Huffman + file metadata)</text>
    <text x="16" y="87" fill="#4A5060" font-family="-apple-system, sans-serif" font-size="11.5">• Circuit Breaker + Canary + DFA PII Redactor + Batching OtlpBatchWorker</text>
