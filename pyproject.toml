[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-mcp"
version = "1.0.0"
description = "Production-grade enterprise Model Context Protocol (MCP) Management Platform: AutoCrawler discovery, dynamic virtual server proxies, wire protocol translation (HTTP, gRPC, TChannel), Omni MCP incremental search, Response Projection, and Code Mode CLI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
omni = "omni_mcp.extension.aifx:main"
omni-gateway = "omni_mcp.server:main"
aifx = "omni_mcp.extension.aifx:main"

[tool.setuptools]
packages = [
    "omni_mcp",
    "omni_mcp.models",
    "omni_mcp.control_plane",
    "omni_mcp.data_plane",
    "omni_mcp.extension",
    "omni_mcp.storage"
]
