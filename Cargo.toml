[workspace]
members = [".", "crates/omni-process-guard"]
resolver = "2"

[package]
name = "omni-mcp"
version = "6.8.0"
rust-version = "1.75.0"
edition = "2021"
authors = ["Omni MCP Engineering"]
description = "High-performance Rust enterprise Model Context Protocol (MCP) & Omni Code Mode Gateway: AutoCrawler IDL discovery, TypeScript .d.ts type generation, sub-millisecond in-process Code Mode sandbox, wire envelope framing & protocol translation, Okapi BM25 ranking, circuit breaking, OTel W3C distributed tracing, and SHA-256 Merkle audit trail."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/Rangow4562/omni-mcp-gateway"
homepage = "https://github.com/Rangow4562/omni-mcp-gateway"
keywords = ["mcp", "gateway", "model-context-protocol", "json-rpc", "llm"]
categories = ["web-programming", "network-programming", "command-line-utilities"]

[features]
default = ["os-csprng"]
os-csprng = ["dep:getrandom"]
tls-rustls = ["dep:rustls", "dep:webpki-roots", "dep:ring"]
async-runtime = ["dep:tokio"]
storage-sqlite = ["dep:rusqlite"]
storage-postgres = []
sandbox-wasm = ["dep:wasmi"]
process-containment = ["dep:omni-process-guard"]
transport-http = []
transport-grpc = []
legacy-sse = []
testing-mocks = []

[dependencies]
getrandom = { version = "0.2", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
ring = { version = "0.17", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "signal", "sync", "time", "macros"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
wasmi = { version = "0.40", optional = true }
omni-process-guard = { path = "crates/omni-process-guard", optional = true }

[lib]
name = "omni_mcp"
path = "src/lib.rs"

[[bin]]
name = "omni-gateway"
path = "src/main.rs"

[[bin]]
name = "omni"
path = "src/bin/omni.rs"

[[bin]]
name = "aifx"
path = "src/bin/aifx.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
