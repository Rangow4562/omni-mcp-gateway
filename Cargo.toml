[package]
name = "omni-mcp"
version = "4.5.0"
edition = "2021"
authors = ["Omni MCP Engineering"]
description = "High-performance Rust enterprise Model Context Protocol (MCP) & Omni Code Mode Gateway: AutoCrawler IDL discovery, TypeScript .d.ts type generation, sub-millisecond in-process Code Mode sandbox, binary wire protocol translation, circuit breaking, OTel W3C distributed tracing, and SHA-256 Merkle audit trail."
readme = "README.md"

[lib]
name = "omni_mcp"
path = "src/lib.rs"

[[bin]]
name = "omni-gateway"
path = "src/main.rs"

[[bin]]
name = "omni"
path = "src/bin/omni.rs"

[[bin]]
name = "aifx"
path = "src/bin/aifx.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

